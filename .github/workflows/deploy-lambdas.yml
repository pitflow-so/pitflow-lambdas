name: Build and Deploy Lambdas

on:
  push:
    branches: [main]
    paths:
      - 'lambdas/**'
      - 'layers/**'
      - 'infra/terraform/**'
      - '.github/workflows/deploy-lambdas.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.12'

jobs:
  # -------------------------------------------------------------------------
  # JOB 1 - Build and validate
  # -------------------------------------------------------------------------
  build-artifacts:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependências do build script
        run: |
          python -m pip install --upgrade pip
          if [ -f layers/shared/requirements.txt ]; then
            pip install -r layers/shared/requirements.txt
          fi

      - name: Gerar ZIPs das Lambdas e Layer
        run: python infra/terraform/scripts/build_artifacts.py

      - name: Validar artefatos gerados
        run: |
          echo "Verificando ZIPs gerados..."
          ls -lh infra/terraform/artifacts/
          test -f infra/terraform/artifacts/pitflow-auth.zip || exit 1
          test -f infra/terraform/artifacts/pitflow-budget-form.zip || exit 1
          test -f infra/terraform/artifacts/pitflow-shared-layer.zip || exit 1
          echo "✅ Todos os artefatos foram gerados com sucesso"

          
      - name: Upload dos artefatos para o deploy
        uses: actions/upload-artifact@v4
        with:
          name: lambda-artifacts
          path: infra/terraform/artifacts/
          retention-days: 1

  # -------------------------------------------------------------------------
  # JOB 2 - Terraform Deploy
  # -------------------------------------------------------------------------
  terraform-deploy:
    runs-on: ubuntu-latest
    needs: build-artifacts
    
    permissions:
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download dos artefatos do Build
        uses: actions/download-artifact@v4
        with:
          name: lambda-artifacts
          path: infra/terraform/artifacts/

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan

      - name: Outputs do Terraform
        working-directory: infra/terraform
        run: terraform output

      - name: Capturar Outputs do Terraform
        id: tf-outputs
        working-directory: infra/terraform
        run: |
          # Extrai os valores crus (sem aspas) do Terraform
          ALB_URL=$(terraform output -raw eks_alb_url_resolved)
          APIGW_URL=$(terraform output -raw api_gateway_endpoint)
          
          # Joga para as variáveis de ambiente do GitHub Actions
          echo "ALB_URL=$ALB_URL" >> $GITHUB_ENV
          echo "APIGW_URL=$APIGW_URL" >> $GITHUB_ENV

      - name: Notificação de sucesso
        if: success()
        run: |
          echo "✅ Deploy concluído com sucesso!"
          echo "Lambdas deployadas:"
          echo "  - pitflow-auth"
          echo "  - pitflow-budget-form"
          echo "Layer deployada:"
          echo "  - pitflow-shared"
          echo "------------------------------------------------------"
          echo "🎯 EKS LoadBalancer URL (Backend): ${{ env.ALB_URL }}"
          echo "🚀 API Gateway Base URL (Frontend): ${{ env.APIGW_URL }}"
          echo "------------------------------------------------------"

      - name: Atualizar Secret e ConfigMap do EKS com URL do API Gateway
        env:
          EKS_CLUSTER_NAME: "pitflow-eks"
        run: |
          set -eo pipefail
          echo "🔄 1. Salvando APIGW_URL no Secrets Manager..."
          
          CURRENT_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "pitflow/bootstrap" \
            --query SecretString \
            --output text)
          
          UPDATED_SECRET=$(echo "$CURRENT_SECRET" | jq --arg url "$APIGW_URL" '. + {API_PUBLIC_URL: $url}')
          
          aws secretsmanager update-secret \
          --secret-id "pitflow/bootstrap" \
          --secret-string "$UPDATED_SECRET" > /dev/null
          
          echo "🔄 2. Configurando acesso ao EKS..."
          aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region us-east-1
          
          echo "🔄 3. Atualizando ConfigMap no EKS..."
          kubectl patch configmap pitflow-config -p "{\"data\":{\"API_PUBLIC_URL\":\"$APIGW_URL\"}}"
          
          echo "🔄 4. Reiniciando os Pods do Spring Boot..."
          kubectl rollout restart deployment/pitflow-backend
          kubectl rollout status deployment/pitflow-backend --timeout=300s || {
            echo "❌ Rollout falhou, revertendo..."
            kubectl rollout undo deployment/pitflow-backend
            exit 1
          }
          
          echo "✅ Fluxo de retroalimentação concluído!"
      
          